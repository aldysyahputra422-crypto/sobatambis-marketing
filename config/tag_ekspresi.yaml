# Kosakata tag ekspresi jalur SENGGANG. Satu-satunya sumber: prompt ChatGPT, parser, dan lembar tempel membaca berkas ini.
# Tag di luar daftar DITOLAK oleh scripts/senggang/impor.py (tidak ditebak).
#
# terverifikasi:
#   dokumentasi = tag tertulis di dokumentasi resmi ElevenLabs (best-practices, diperiksa 2026-11-05).
#   belum       = BELUM terbukti. Dokumentasi hanya bilang v3 boleh menerima tag deskriptif bebas dan hasilnya
#                 bergantung suara. Pemilik menguji setelah berlangganan, lalu mengubah nilai ini.
# Berkas ini TIDAK mengklaim tag berfungsi untuk bahasa Indonesia (dokumentasi tidak menyebut dukungan bahasa).
# cadangan = tag terverifikasi yang dipakai pemilik bila tag aslinya tidak berpengaruh saat diuji.
#
# emosi harus salah satu enum skema naskah2 dan selaras dengan tabel sistem emosi di skills/sa-cerita/references/story-bible.md.
# ekspresi.orang = ekspresi rig Arta/Ratna (datar ambis kaget senyum lirik marah panik tawa tidur hancur),
# ekspresi.mbis  = ekspresi rig Mbis (senang intip datar tutup). Tes menjaga daftar ini sama dengan template/src/sistem/gambar.ts.
versi: 1
sumber_dokumentasi: https://elevenlabs.io/docs/overview/capabilities/text-to-speech/best-practices
diperiksa: 2026-11-05

# Awalan khusus di dalam kurung siku pada baris dialog. Tidak pernah dikirim ke ElevenLabs.
non_suara:
  aksi: "[aksi: banting]  -> aksi tokoh penutur (nama aksi dari pustaka template), jatuh di kata berikutnya"
  sfx: "[sfx: bel]       -> efek bunyi di kata berikutnya"
  narasi: "[narasi: ...]   -> catatan penulis, dibuang dari dialog dan lembar ElevenLabs"

tag:
  # --- usulan pemilik ---
  tense:
    jenis: suara
    emosi: tertekan
    intensitas: 6
    ekspresi: {orang: lirik, mbis: intip}
    elevenlabs: "[tense]"
    terverifikasi: belum
    cadangan: "[whispers]"
  curious:
    jenis: suara
    emosi: semangat
    intensitas: 4
    ekspresi: {orang: ambis, mbis: intip}
    elevenlabs: "[curious]"
    terverifikasi: dokumentasi
  ominous:
    jenis: suara
    emosi: misterius
    intensitas: 7
    ekspresi: {orang: lirik, mbis: intip}
    elevenlabs: "[ominous]"
    terverifikasi: belum
    cadangan: "[whispers]"
  confused:
    jenis: suara
    emosi: kaget
    intensitas: 3
    ekspresi: {orang: lirik, mbis: intip}
    elevenlabs: "[confused]"
    terverifikasi: belum
    cadangan: "[curious]"
  slowly:
    jenis: pengubah
    delta: 0
    elevenlabs: "[slowly]"
    terverifikasi: belum
    cadangan: "[long pause]"
  # --- dari TAG_KUAT (scripts/suara/produksi.py) dan tabel emosi story-bible ---
  excited:
    jenis: suara
    emosi: semangat
    intensitas: 7
    ekspresi: {orang: ambis, mbis: senang}
    elevenlabs: "[excited]"
    terverifikasi: dokumentasi
  shouting:
    jenis: suara
    emosi: marah
    intensitas: 9
    ekspresi: {orang: marah, mbis: datar}
    elevenlabs: "[shouting]"
    terverifikasi: belum   # dokumentasi hanya menyebutnya sebagai contoh tag yang mungkin tidak dilatih pada suara
    cadangan: "[angry]"
  frustrated:
    jenis: suara
    emosi: marah
    intensitas: 6
    ekspresi: {orang: marah, mbis: datar}
    elevenlabs: "[frustrated]"
    terverifikasi: belum
    cadangan: "[annoyed]"
  angry:
    jenis: suara
    emosi: marah
    intensitas: 7
    ekspresi: {orang: marah, mbis: datar}
    elevenlabs: "[angry]"
    terverifikasi: dokumentasi
  annoyed:
    jenis: suara
    emosi: marah
    intensitas: 5
    ekspresi: {orang: marah, mbis: datar}
    elevenlabs: "[annoyed]"
    terverifikasi: dokumentasi
  sighs:
    jenis: suara
    emosi: tertekan
    intensitas: 5
    ekspresi: {orang: lirik, mbis: tutup}
    elevenlabs: "[sighs]"
    terverifikasi: dokumentasi
  tired:
    jenis: suara
    emosi: lelah
    intensitas: 5
    ekspresi: {orang: tidur, mbis: tutup}
    elevenlabs: "[tired]"
    terverifikasi: belum
    cadangan: "[sighs]"
  quietly:
    jenis: suara
    emosi: hancur
    intensitas: 6
    ekspresi: {orang: hancur, mbis: tutup}
    elevenlabs: "[quietly]"
    terverifikasi: belum
    cadangan: "[whispers]"
  sad:
    jenis: suara
    emosi: hancur
    intensitas: 5
    ekspresi: {orang: hancur, mbis: tutup}
    elevenlabs: "[sad]"
    terverifikasi: dokumentasi
  crying:
    jenis: suara
    emosi: hancur
    intensitas: 8
    ekspresi: {orang: hancur, mbis: tutup}
    elevenlabs: "[crying]"
    terverifikasi: dokumentasi
  gasps:
    jenis: suara
    emosi: kaget
    intensitas: 8
    ekspresi: {orang: kaget, mbis: senang}
    elevenlabs: "[gasps]"
    terverifikasi: belum   # dokumentasi hanya memuat [happy gasp]
    cadangan: "[surprised]"
  surprised:
    jenis: suara
    emosi: kaget
    intensitas: 6
    ekspresi: {orang: kaget, mbis: senang}
    elevenlabs: "[surprised]"
    terverifikasi: dokumentasi
  whispers:
    jenis: suara
    emosi: misterius
    intensitas: 6
    ekspresi: {orang: lirik, mbis: intip}
    elevenlabs: "[whispers]"
    terverifikasi: dokumentasi
  warm:
    jenis: suara
    emosi: hangat
    intensitas: 4
    ekspresi: {orang: senyum, mbis: senang}
    elevenlabs: "[warm]"
    terverifikasi: belum
    cadangan: "[happy]"
  happy:
    jenis: suara
    emosi: semangat
    intensitas: 5
    ekspresi: {orang: senyum, mbis: senang}
    elevenlabs: "[happy]"
    terverifikasi: dokumentasi
  laughs:
    jenis: suara
    emosi: semangat
    intensitas: 6
    ekspresi: {orang: tawa, mbis: senang}
    elevenlabs: "[laughs]"
    terverifikasi: dokumentasi
  sarcastic:
    jenis: suara
    emosi: datar
    intensitas: 5
    ekspresi: {orang: datar, mbis: datar}
    elevenlabs: "[sarcastic]"
    terverifikasi: dokumentasi
  deadpan:
    jenis: suara
    emosi: datar
    intensitas: 3
    ekspresi: {orang: datar, mbis: datar}
    elevenlabs: "[deadpan]"
    terverifikasi: belum
    cadangan: "[sarcastic]"
  # --- pengubah (tidak mengubah emosi) ---
  loudly:
    jenis: pengubah
    delta: 2
    elevenlabs: "[loudly]"
    terverifikasi: belum
    cadangan: "[shouting]"
  softly:
    jenis: pengubah
    delta: -2
    elevenlabs: "[softly]"
    terverifikasi: belum
    cadangan: "[whispers]"
  quickly:
    jenis: pengubah
    delta: 1
    elevenlabs: "[quickly]"
    terverifikasi: belum
    cadangan: "[excited]"
  pause:
    jenis: pengubah
    delta: 0
    elevenlabs: "[short pause]"
    terverifikasi: dokumentasi
    cadangan: "[long pause]"
