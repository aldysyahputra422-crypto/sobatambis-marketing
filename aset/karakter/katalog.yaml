# Aset karakter kantor live (Departemen Marketing). Gambar asli TIDAK disimpan di repo publik ini.
acuan_chibi:
  file: disimpan-pemilik (tidak di repo publik)
  jenis: gambar acuan gaya dan karakter untuk kantor 3D
  sumber: sketsa karakter chibi buatan teman pemilik
  lisensi: izin-pembuat-lewat-chat
  syarat: gratis, boleh dipakai untuk aset Sobat Ambis (izin pembuat lewat chat WhatsApp, 2026-11-03; tangkapan layar disimpan pemilik)
  dipakai_untuk: 16 desain karakter kantor live (rambut, baju, ekspresi per agent), dirender ulang secara prosedural di kantor/runtime/public/assets/sa/watak.js dan karakter.js
  catatan: jangan mengunggah gambar aslinya ke repo publik tanpa izin tambahan dari pembuat; dua desain tambahan (Pemilik, Pencari Skill) dibuat baru dengan gaya yang sama
